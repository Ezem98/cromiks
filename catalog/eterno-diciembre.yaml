# =====================================================================
# Eterno Diciembre — Master Catálogo
# Primer álbum de Replay: Argentina Campeón del Mundo 2022
# =====================================================================
#
# Este archivo es la fuente única de verdad del contenido del álbum.
# Define los 205 cromos con su metadata, rareza y fuentes a procesar.
#
# Estructura de cada cromo:
#   - id: slug único (kebab-case)
#   - name: nombre display
#   - page: id de la página a la que pertenece
#   - rarity: common | uncommon | rare | epic | legendary
#   - card_number: 1-205, único en el álbum
#   - description: copy corto para el detalle del cromo
#   - content: definición de assets a procesar
#       photo: bloque de provenance + pipeline R2. Separa INPUT (de dónde sale)
#         de OUTPUT (qué se sirve). Campos que escribís a mano vs los que completa la CLI:
#           # --- INPUT (curado a mano) ---
#           type:          official | video_capture | collage | social-media (intent de procesamiento)
#           source_url:    URL HQ de la fuente, o "TODO" si todavía no se curó
#           source_kind:   adapter de la CLI → wikimedia | direct | x | instagram | manual | "TODO"
#                          (x: pegás el link del tweet; instagram: best-effort, suele requerir login)
#           author:        autor/fotógrafo original (para dar crédito). "TODO" si falta.
#           license:       cc-by | cc-by-sa | cc0 | all-rights-reserved | ai-generated | "TODO"
#           legal_posture: licensed | takedown  (≠ license: si va por baja-a-pedido)
#           # --- OUTPUT (lo completa la CLI, NO editar a mano) ---
#           asset:         key R2 = cromos/<album>/<card_id>.<hash>.webp (la URL servida es ${R2_PUBLIC_BASE}/${asset})
#           credit:        string armado de author+license+source para alt/caption
#           fetched_at:    fecha de obtención
#           content_hash:  sha256 del asset (change-detection en --force, no dedup cross-card)
#           status:        pending | published | takedown  (takedown = terminal, baja legal)
#       video: { type, source_url, start, duration } (rare+ solo)         — pipeline F2
#       audio: { source_url, start, duration } (cromos de audio)          — pipeline F2
#       relator_clip: { source_url, start, duration, relator } (epic+ solo) — pipeline F2
#   - metadata: contexto del momento
#
# Máquina de estados del asset (status):
#   - pending   → todavía no se obtuvo/subió a R2 (runtime sirve placeholder)
#   - published → asset en R2, se renderiza
#   - takedown  → baja legal (UPDATE SQL, sin redeploy). TERMINAL: el reseed NUNCA lo revive.
#                 La URL servida es siempre R2; source_url queda solo como provenance.
#
# =====================================================================

meta:
  album_id: "eterno-diciembre"
  album_name: "Eterno Diciembre"
  album_subtitle: "Argentina Campeón del Mundo 2022"
  total_cards: 205
  language: "es-AR"
  version: "1.0.0"
  release_date: "2026-06-XX"
  created_at: "2026-05-24"

